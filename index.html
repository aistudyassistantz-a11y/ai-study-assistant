
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyMate - AI Study Assistant</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fc;
      color: #202944;
    }
    header {
      background: #4f46e5;
      color: white;
      padding: 24px 16px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; }
    header p { margin: 0; }
    main {
      max-width: 850px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .panel {
      background: white;
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 14px #18264a10;
    }
    h2 { margin-top: 0; }
    label {
      display: block;
      margin: 14px 0 8px;
      font-weight: bold;
    }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd3e0;
      border-radius: 8px;
      font: inherit;
    }
    textarea { min-height: 160px; resize: vertical; }
    button {
      background: #4f46e5;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      margin: 10px 6px 0 0;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { background: #3730a3; }
    .secondary { background: #e8eaff; color: #3730a3; }
    .secondary:hover { background: #d9dcff; }
    #output {
      white-space: pre-wrap;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }
    .hint { color: #626b80; font-size: 14px; }
    footer { text-align: center; padding: 20px; color: #626b80; }
  </style>
</head>
<body>
  <header>
    <h1>📚 StudyMate</h1>
    <p>Your simple study companion</p>
  </header>

  <main>
    <section class="panel">
      <h2>📝 Your Study Notes</h2>
      <label for="topic">Topic (optional)</label>
      <input id="topic" placeholder="e.g. Photosynthesis">

      <label for="notes">Paste your notes here</label>
      <textarea id="notes" placeholder="Paste your textbook notes or class notes here..."></textarea>
      <p class="hint">Tip: Add a few sentences or paragraphs for better results.</p>

      <button onclick="summarizeNotes()">Summarize Notes</button>
      <button onclick="makePlan()">Make Study Plan</button>
      <button onclick="makeQuiz()">Practice Questions</button>
      <button class="secondary" onclick="clearAll()">Clear</button>
    </section>

    <section class="panel">
      <h2>✨ Your Results</h2>
      <div id="output">Your results will appear here.</div>
      <button class="secondary" onclick="copyResult()">Copy Results</button>
    </section>
  </main>

  <footer>StudyMate · Learn a little every day</footer>

  <script>
    function getNotes() {
      return document.getElementById("notes").value.trim();
    }

    function getTopic() {
      return document.getElementById("topic").value.trim() || "your topic";
    }

    function showResult(text) {
      document.getElementById("output").textContent = text;
    }

    function getSentences(text) {
      return (text.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [])
        .map(s => s.trim())
        .filter(s => s.length > 0);
    }

    function words(text) {
      return text.toLowerCase().match(/[a-z0-9'-]+/g) || [];
    }

    const commonWords = new Set([
      "the","and","for","are","but","not","you","your","with","from",
      "that","this","these","those","was","were","have","has","had",
      "its","into","their","they","them","then","than","can","will",
      "would","could","should","about","also","which","when","where",
      "what","who","how","why","all","any","each","more","most","some",
      "such","very","much","many","been","being","there","here","our",
      "out","use","used","using","per","because","while","during","through",
      "into","over","under","between","after","before","is","am","be",
      "to","of","in","on","at","by","as","an","a","or","it","if"
    ]);

    function summarizeNotes() {
      const text = getNotes();
      if (!text) {
        showResult("Please paste your notes first.");
        return;
      }

      const sentences = getSentences(text);
      if (sentences.length <= 2) {
        showResult("Summary:\n\n" + text);
        return;
      }

      const counts = {};
      words(text).forEach(word => {
        if (word.length > 2 && !commonWords.has(word)) {
          counts[word] = (counts[word] || 0) + 1;
        }
      });

      const scored = sentences.map((sentence, index) => {
        const sentenceWords = words(sentence);
        let score = 0;
        sentenceWords.forEach(word => {
          if (counts[word]) score += counts[word];
        });
        score = score / Math.max(sentenceWords.length, 1);
        return { sentence, index, score };
      });

      const desiredCount = Math.max(2, Math.ceil(sentences.length * 0.35));
      const selected = scored
        .sort((a, b) => b.score - a.score)
        .slice(0, Math.min(desiredCount, sentences.length))
        .sort((a, b) => a.index - b.index);

      const summary = selected.map(item => item.sentence).join(" ");

      showResult(
        "SUMMARY: " + getTopic() + "\n\n" +
        summary +
        "\n\nOriginal sentences: " + sentences.length +
        "\nSummary sentences: " + selected.length +
        "\n\nNote: This is an extractive summary made from your own text, not an AI-generated explanation."
      );
    }

    function makePlan() {
      const text = getNotes();
      const topic = getTopic();
      let result = "STUDY PLAN: " + topic + "\n\n";

      if (text) {
        const sentences = getSentences(text);
        result += "Use these steps with your notes:\n\n";
        result += "1. Read the notes once to understand the main idea.\n";
        result += "2. Review these key points:\n";
        sentences.slice(0, 5).forEach((s, i) => {
          result += "   " + (i + 1) + ". " + s + "\n";
        });
        result += "\n3. Explain the key points in your own words.\n";
        result += "4. Hide your notes and recall what you learned.\n";
        result += "5. Review anything you could not remember.";
      } else {
        result += "1. Write down what you already know about " + topic + ".\n";
        result += "2. Find reliable class materials about the topic.\n";
        result += "3. Break the topic into smaller ideas.\n";
        result += "4. Write a short explanation of each idea.\n";
        result += "5. Test yourself without looking at your notes.\n";
        result += "6. Review the parts you find difficult.";
      }

      showResult(result);
    }

    function makeQuiz() {
      const text = getNotes();
      if (!text) {
        showResult("Please paste your notes first so I can create practice questions from them.");
        return;
      }

      const sentences = getSentences(text)
        .filter(s => words(s).length >= 5);

      if (sentences.length === 0) {
        showResult("Please paste a little more text, including full sentences.");
        return;
      }

      const questions = sentences.slice(0, 5);
      let result = "PRACTICE QUESTIONS: " + getTopic() + "\n\n";

      questions.forEach((sentence, index) => {
        result += (index + 1) + ". Explain this idea in your own words:\n";
        result += sentence + "\n\n";
      });

      result += "BONUS:\nWrite down the three most important facts you learned.\n\n";
      result += "These questions are based on your notes. Check your answers against your original materials.";

      showResult(result);
    }

    function clearAll() {
      document.getElementById("topic").value = "";
      document.getElementById("notes").value = "";
      showResult("Your results will appear here.");
    }

    async function copyResult() {
      const text = document.getElementById("output").textContent;
      try {
        await navigator.clipboard.writeText(text);
        alert("Results copied!");
      } catch (error) {
        const area = document.createElement("textarea");
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();
        alert("Results copied!");
      }
    }
  </script>
</body>
</html>
